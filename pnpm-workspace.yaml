packages:
  - "."
# pnpm 10(Workers Buildsのビルド環境)用。pnpm 11 の allowBuilds と同じ内容
onlyBuiltDependencies:
  - esbuild
  - workerd
# Pre-approve build scripts for the packages C3 itself installs that need
# them: `workerd` downloads the platform binary and `esbuild` downloads/
# builds native bindings. Without these, pnpm 11+ aborts the install with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@prisma/client': false
  better-sqlite3: false
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/vitest-plugin@1.2.7'
  - miniflare@5.20260923.0-alpha
  - wrangler@4.140.0
  - '@better-auth/core@1.7.6'
  - '@better-auth/drizzle-adapter@1.7.6'
  - '@better-auth/kysely-adapter@1.7.6'
  - '@better-auth/memory-adapter@1.7.6'
  - '@better-auth/mongo-adapter@1.7.6'
  - '@better-auth/prisma-adapter@1.7.6'
  - '@better-auth/telemetry@1.7.6'
  - auth@1.7.6
  - better-auth@1.7.6
