<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ログイン(PC)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;background:#F5F5F3;color:#1F1F1D}
a{color:#1F1F1D}a:hover{color:#57574F}
button,input{font-family:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #1F1F1D;outline-offset:2px}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #F5F5F3; display: flex; flex-direction: column; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #1F1F1D">
  <header style="height: 72px; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E3E2DC">
    <a href="TopPC.dc.html" style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; text-decoration: none; min-height: 44px; display: flex; align-items: center">shukanlog</a>
  </header>
  <main style="flex-grow: 1; display: flex; align-items: flex-start; justify-content: center; padding-top: 48px; box-sizing: border-box">
    <div style="width: 440px; background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 20px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
      <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.4">ログイン</h1>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="email" style="font-size: 14px; font-weight: 700">メールアドレス</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" aria-describedby="email-error" aria-invalid="{{ emailErrInvalid }}" onInput="{{ onEmail }}" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #1F1F1D">
        <sc-if value="{{ emailErrHas }}" hint-placeholder-val="{{ false }}"><p id="email-error" style="margin: 0; font-size: 13px; color: #B42318">{{ emailErr }}</p></sc-if>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="password" style="font-size: 14px; font-weight: 700">パスワード</label>
        <div style="display: flex; gap: 8px">
          <input id="password" type="{{ pwType }}" autocomplete="current-password" aria-describedby="password-error" aria-invalid="{{ pwErrInvalid }}" onInput="{{ onPassword }}" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #1F1F1D; flex: 1 1 auto; min-width: 0">
          <button type="button" aria-pressed="{{ pwShown }}" onClick="{{ togglePw }}" style="flex-shrink: 0; min-width: 64px; height: 48px; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; font-size: 14px; color: #1F1F1D; cursor: pointer">{{ pwLabel }}</button>
        </div>
        <sc-if value="{{ pwErrHas }}" hint-placeholder-val="{{ false }}"><p id="password-error" style="margin: 0; font-size: 13px; color: #B42318">{{ pwErr }}</p></sc-if>
      </div>
      <a href="ResetRequestPC.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; font-size: 14px">パスワードをお忘れの方</a>
      <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ submit }}" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%">ログイン</button></sc-if>
      <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; line-height: 1.6; color: #57574F">入力チェックに成功しました(プロトタイプ)</span>
          <a href="DayPC.dc.html" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none">記録画面へ</a>
        </div>
      </sc-if>
      <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #57574F; text-align: center">アカウントをお持ちでない方は <a href="SignupPC.dc.html" style="font-weight: 700">新規登録</a></p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', password: '', tried: false, done: false, showPw: false, resent: false };
  }
  rules() {
    return {
      email: (v) => !v ? 'メールアドレスを入力してください' : (v.indexOf('@') < 1 ? 'メールアドレスの形式が正しくありません' : ''),
      password: (v) => !v ? 'パスワードを入力してください' : ''
    };
  }
  renderVals() {
    const R = this.rules();
    const out = {
      emailErr: this.state.tried ? R.email(this.state.email) : '',
      pwErr: this.state.tried ? R.password(this.state.password) : ''
    };
    out.emailErrHas = out.emailErr !== ''; out.emailErrInvalid = out.emailErr !== '' ? 'true' : 'false';
    out.pwErrHas = out.pwErr !== ''; out.pwErrInvalid = out.pwErr !== '' ? 'true' : 'false';
    const keys = Object.keys(R);
    return Object.assign(out, {
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPassword: (e) => this.setState({ password: e.target.value }),
      onCode: (e) => this.setState({ code: e.target.value.replace(/[^0-9]/g, '') }),
      onAgree: (e) => this.setState({ agree: e.target.checked }),
      submit: () => {
        const ok = keys.every((k) => R[k](this.state[k]) === '');
        this.setState({ tried: true, done: ok });
      },
      done: this.state.done,
      notDone: !this.state.done,
      pwType: this.state.showPw ? 'text' : 'password',
      pwShown: this.state.showPw ? 'true' : 'false',
      pwLabel: this.state.showPw ? '隠す' : '表示',
      togglePw: () => this.setState({ showPw: !this.state.showPw }),
      resent: this.state.resent,
      resend: () => this.setState({ resent: true })
    });
  }
}
</script>
</body>
</html>
