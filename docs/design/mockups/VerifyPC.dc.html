<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>メールアドレスの確認(PC)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;background:#F5F5F3;color:#1F1F1D}
a{color:#1F1F1D}a:hover{color:#57574F}
button,input{font-family:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #1F1F1D;outline-offset:2px}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #F5F5F3; display: flex; flex-direction: column; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #1F1F1D">
  <header style="height: 72px; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E3E2DC">
    <a href="TopPC.dc.html" style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; text-decoration: none; min-height: 44px; display: flex; align-items: center">shukanlog</a>
  </header>
  <main style="flex-grow: 1; display: flex; align-items: flex-start; justify-content: center; padding-top: 48px; box-sizing: border-box">
    <div style="width: 440px; background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 20px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
      <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.4">メールアドレスの確認</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.8; color: #57574F">[入力したメールアドレス] に6桁の確認コードを送りました。コードの有効期限は10分です。</p>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="code" style="font-size: 14px; font-weight: 700">確認コード</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" aria-describedby="code-error" aria-invalid="{{ codeErrInvalid }}" onInput="{{ onCode }}" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #1F1F1D" maxlength="6">
        <sc-if value="{{ codeErrHas }}" hint-placeholder-val="{{ false }}"><p id="code-error" style="margin: 0; font-size: 13px; color: #B42318">{{ codeErr }}</p></sc-if>
      </div>
      <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ submit }}" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%">確認する</button></sc-if>
      <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; line-height: 1.6; color: #57574F">入力チェックに成功しました(プロトタイプ)</span>
          <a href="ConsentPC.dc.html" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none">次へ(利用規約への同意)</a>
        </div>
      </sc-if>
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: flex-start">
        <button type="button" onClick="{{ resend }}" style="min-height: 44px; border: none; background: transparent; padding: 0; font-size: 14px; font-weight: 700; color: #1F1F1D; text-decoration: underline; cursor: pointer">確認コードを再送する</button>
        <sc-if value="{{ resent }}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 13px; line-height: 1.6; color: #57574F">再送しました。次の再送は60秒後からできます。</span></sc-if>
        <span style="font-size: 13px; line-height: 1.6; color: #57574F">届かない場合は、迷惑メールフォルダも確認してください。</span>
        <a href="SignupPC.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px">メールアドレスを入力し直す</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { code: '', tried: false, done: false, showPw: false, resent: false };
  }
  rules() {
    return {
      code: (v) => !/^[0-9]{6}$/.test(v) ? '6桁の数字を入力してください' : ''
    };
  }
  renderVals() {
    const R = this.rules();
    const out = {
      codeErr: this.state.tried ? R.code(this.state.code) : ''
    };
    out.codeErrHas = out.codeErr !== ''; out.codeErrInvalid = out.codeErr !== '' ? 'true' : 'false';
    const keys = Object.keys(R);
    return Object.assign(out, {
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPassword: (e) => this.setState({ password: e.target.value }),
      onCode: (e) => this.setState({ code: e.target.value.replace(/[^0-9]/g, '') }),
      onAgree: (e) => this.setState({ agree: e.target.checked }),
      submit: () => {
        const ok = keys.every((k) => R[k](this.state[k]) === '');
        this.setState({ tried: true, done: ok });
      },
      done: this.state.done,
      notDone: !this.state.done,
      pwType: this.state.showPw ? 'text' : 'password',
      pwShown: this.state.showPw ? 'true' : 'false',
      pwLabel: this.state.showPw ? '隠す' : '表示',
      togglePw: () => this.setState({ showPw: !this.state.showPw }),
      resent: this.state.resent,
      resend: () => this.setState({ resent: true })
    });
  }
}
</script>
</body>
</html>
