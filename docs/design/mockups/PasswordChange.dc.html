<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>パスワードの変更</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;background:#F5F5F3;color:#1F1F1D}
a{color:#1F1F1D}a:hover{color:#57574F}
button,input,textarea{font-family:inherit}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #1F1F1D;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F3; display: flex; flex-direction: column; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #1F1F1D">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 12px 0; height: 56px; box-sizing: border-box">
    <a href="Settings.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 20px">パスワードの変更</h1>
  </header>
  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 16px 20px 24px; box-sizing: border-box">
    <div style="background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <sc-if value="{{ step0 }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="curPw" style="font-size: 14px; font-weight: 700">現在のパスワード</label>
        <div style="display: flex; gap: 8px">
          <input id="curPw" type="{{ pwType }}" autocomplete="current-password" aria-describedby="curPw-error" aria-invalid="{{ curPwInvalid }}" onInput="{{ on_curPw }}" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #1F1F1D; flex: 1 1 auto; min-width: 0">
          <button type="button" aria-pressed="{{ pwShown }}" onClick="{{ togglePw }}" style="flex-shrink: 0; min-width: 64px; height: 48px; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; font-size: 14px; color: #1F1F1D; cursor: pointer">{{ pwLabel }}</button>
        </div>
        <sc-if value="{{ curPwErrHas }}" hint-placeholder-val="{{ false }}"><p id="curPw-error" style="margin: 0; font-size: 13px; color: #B42318">{{ curPwErr }}</p></sc-if>
      </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="newPw" style="font-size: 14px; font-weight: 700">新しいパスワード</label>
        <span id="newPw-help" style="font-size: 13px; line-height: 1.6; color: #57574F">8文字以上</span>
        <div style="display: flex; gap: 8px">
          <input id="newPw" type="{{ pwType }}" autocomplete="new-password" aria-describedby="newPw-help newPw-error" aria-invalid="{{ newPwInvalid }}" onInput="{{ on_newPw }}" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #1F1F1D; flex: 1 1 auto; min-width: 0">
          <button type="button" aria-pressed="{{ pwShown }}" onClick="{{ togglePw }}" style="flex-shrink: 0; min-width: 64px; height: 48px; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; font-size: 14px; color: #1F1F1D; cursor: pointer">{{ pwLabel }}</button>
        </div>
        <sc-if value="{{ newPwErrHas }}" hint-placeholder-val="{{ false }}"><p id="newPw-error" style="margin: 0; font-size: 13px; color: #B42318">{{ newPwErr }}</p></sc-if>
      </div>
        <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #57574F">変更すると、ほかの端末ではログアウトされます。</p>
        <button type="button" onClick="{{ submit }}" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%">パスワードを変更する</button>
      </div>
      </sc-if>
      <sc-if value="{{ step1 }}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; flex-direction: column; gap: 12px">
        <p style="margin: 0; font-size: 15px; line-height: 1.7">パスワードを変更しました。</p>
        <a href="Settings.dc.html" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%">設定に戻る</a>
      </div></sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { values: { curPw: "", newPw: "" }, step: 0, tried: false, showPw: false };
  }
  rules() {
    return {
      curPw: (v) => !v ? 'パスワードを入力してください' : '',
      newPw: (v) => !v ? 'パスワードを入力してください' : (v.length < 8 ? '8文字以上で入力してください' : '')
    };
  }
  renderVals() {
    const R = this.rules();
    const S = [["curPw", "newPw"]];
    const st = this.state;
    const cur = S[st.step] || [];
    const out = {};
    Object.keys(R).forEach((f) => {
      const e = st.tried && cur.indexOf(f) >= 0 ? R[f](st.values[f]) : '';
      out[f + 'Err'] = e; out[f + 'ErrHas'] = e !== ''; out[f + 'Invalid'] = e !== '' ? 'true' : 'false';
      out['on_' + f] = (ev) => this.setState({ values: Object.assign({}, this.state.values, { [f]: ev.target.value }) });
    });
    for (let i = 0; i <= S.length; i++) out['step' + i] = st.step === i;
    out.submit = () => {
      const ok = cur.every((f) => R[f](this.state.values[f]) === '');
      this.setState(ok ? { step: st.step + 1, tried: false } : { tried: true });
    };
    out.pwType = st.showPw ? 'text' : 'password';
    out.pwShown = st.showPw ? 'true' : 'false';
    out.pwLabel = st.showPw ? '隠す' : '表示';
    out.togglePw = () => this.setState({ showPw: !this.state.showPw });

    return out;
  }
}
</script>
</body>
</html>
