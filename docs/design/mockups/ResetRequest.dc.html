<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>パスワードの再設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;background:#F5F5F3;color:#1F1F1D}
a{color:#1F1F1D}a:hover{color:#57574F}
button,input{font-family:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #1F1F1D;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F3; display: flex; flex-direction: column; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #1F1F1D">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 12px 0; height: 56px; box-sizing: border-box">
    <a href="Login.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 20px">shukanlog</span>
  </header>
  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 24px; box-sizing: border-box">
      <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.4">パスワードの再設定</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.8; color: #57574F">登録しているメールアドレスを入力してください。再設定用の6桁のコードを送ります。</p>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="email" style="font-size: 14px; font-weight: 700">メールアドレス</label>
        <input id="email" type="email" autocomplete="email" inputmode="email" aria-describedby="email-error" aria-invalid="{{ emailErrInvalid }}" onInput="{{ onEmail }}" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #1F1F1D">
        <sc-if value="{{ emailErrHas }}" hint-placeholder-val="{{ false }}"><p id="email-error" style="margin: 0; font-size: 13px; color: #B42318">{{ emailErr }}</p></sc-if>
      </div>
      <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ submit }}" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%">コードを送る</button></sc-if>
      <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; line-height: 1.6; color: #57574F">入力チェックに成功しました(プロトタイプ)</span>
          <a href="ResetNew.dc.html" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none">新しいパスワードの設定へ</a>
        </div>
      </sc-if>
      <a href="Login.dc.html" style="align-self: center; min-height: 44px; display: flex; align-items: center; font-size: 14px">ログイン画面に戻る</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', tried: false, done: false, showPw: false, resent: false };
  }
  rules() {
    return {
      email: (v) => !v ? 'メールアドレスを入力してください' : (v.indexOf('@') < 1 ? 'メールアドレスの形式が正しくありません' : '')
    };
  }
  renderVals() {
    const R = this.rules();
    const out = {
      emailErr: this.state.tried ? R.email(this.state.email) : ''
    };
    out.emailErrHas = out.emailErr !== ''; out.emailErrInvalid = out.emailErr !== '' ? 'true' : 'false';
    const keys = Object.keys(R);
    return Object.assign(out, {
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPassword: (e) => this.setState({ password: e.target.value }),
      onCode: (e) => this.setState({ code: e.target.value.replace(/[^0-9]/g, '') }),
      onAgree: (e) => this.setState({ agree: e.target.checked }),
      submit: () => {
        const ok = keys.every((k) => R[k](this.state[k]) === '');
        this.setState({ tried: true, done: ok });
      },
      done: this.state.done,
      notDone: !this.state.done,
      pwType: this.state.showPw ? 'text' : 'password',
      pwShown: this.state.showPw ? 'true' : 'false',
      pwLabel: this.state.showPw ? '隠す' : '表示',
      togglePw: () => this.setState({ showPw: !this.state.showPw }),
      resent: this.state.resent,
      resend: () => this.setState({ resent: true })
    });
  }
}
</script>
</body>
</html>
