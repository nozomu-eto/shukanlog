<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>カロリーの記録・編集</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;background:#F5F5F3;color:#1F1F1D}
a{color:#1F1F1D}a:hover{color:#57574F}
button,input,textarea{font-family:inherit}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #1F1F1D;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: rgba(31, 31, 29, 0.45); display: flex; flex-direction: column; justify-content: flex-end; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #1F1F1D">
  <div role="dialog" aria-modal="true" aria-labelledby="cal-title" style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #C9C8C1"></span>
        <h2 id="cal-title" style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 20px">{{ formTitle }}</h2>
        <span style="font-size: 13px; line-height: 1.6; color: #57574F">9月25日(金)</span>
        <sc-if value="{{ step0 }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="kcal" style="font-size: 14px; font-weight: 700">カロリー</label>
        <div style="display: flex; align-items: center; gap: 8px"><input id="kcal" type="text" inputmode="numeric" placeholder="420" aria-describedby="kcal-error" aria-invalid="{{ kcalInvalid }}" value="{{ kcalVal }}" onChange="{{ on_kcal }}" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #1F1F1D; flex: 1 1 auto; min-width: 0"><span style="font-size: 15px; font-weight: 500">kcal</span></div>
        <sc-if value="{{ kcalErrHas }}" hint-placeholder-val="{{ false }}"><p id="kcal-error" style="margin: 0; font-size: 13px; color: #B42318">{{ kcalErr }}</p></sc-if>
      </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="memo" style="font-size: 14px; font-weight: 700">メモ(任意)</label>
        <span id="memo-help" style="font-size: 13px; line-height: 1.6; color: #57574F">例:朝食。500文字まで</span>
        <input id="memo" type="text" placeholder="朝食" aria-describedby="memo-help memo-error" aria-invalid="{{ memoInvalid }}" value="{{ memoVal }}" onChange="{{ on_memo }}" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #1F1F1D; flex: 1 1 auto; min-width: 0">
        <sc-if value="{{ memoErrHas }}" hint-placeholder-val="{{ false }}"><p id="memo-error" style="margin: 0; font-size: 13px; color: #B42318">{{ memoErr }}</p></sc-if>
      </div>
          <button type="button" onClick="{{ submit }}" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%">保存する</button>
          <a href="Day.dc.html" style="min-height: 52px; border-radius: 14px; border: 1.5px solid #1F1F1D; background: #FFFFFF; color: #1F1F1D; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%">キャンセル</a>
          <sc-if value="{{ isEdit }}" hint-placeholder-val="{{ true }}">
            <div style="border-top: 1px solid #EEEDE8; padding-top: 12px; display: flex; flex-direction: column; gap: 10px">
              <sc-if value="{{ notConfirming }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ askDelete }}" style="align-self: center; min-height: 44px; border: none; background: transparent; font-size: 15px; font-weight: 700; color: #B42318; cursor: pointer">この記録を削除する</button></sc-if>
              <sc-if value="{{ confirming }}" hint-placeholder-val="{{ false }}">
                <div role="alert" style="display: flex; flex-direction: column; gap: 10px">
                  <p style="margin: 0; font-size: 15px; font-weight: 700">この記録を削除しますか?元に戻せません。</p>
                  <div style="display: flex; gap: 8px"><button type="button" onClick="{{ cancelDelete }}" style="min-height: 52px; border-radius: 14px; border: 1.5px solid #1F1F1D; background: #FFFFFF; color: #1F1F1D; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%">やめる</button><a href="Day.dc.html" style="min-height: 52px; border-radius: 14px; border: none; background: #B42318; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 100%; text-decoration: none">削除する</a></div>
                </div>
              </sc-if>
            </div>
          </sc-if>
        </div>
        </sc-if>
        <sc-if value="{{ step1 }}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; flex-direction: column; gap: 12px">
        <p style="margin: 0; font-size: 15px; line-height: 1.7">保存しました。</p>
        <a href="Day.dc.html" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%">日タブに戻る</a>
      </div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}, "mode": {"editor": "enum", "options": ["edit", "new"], "default": "edit"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { values: { kcal: "420", memo: "朝食" }, step: 0, tried: false, showPw: false, confirmDelete: false };
    if (props && props.mode === 'new') { this.state.values = { kcal: '', memo: '' }; }
  }
  rules() {
    return {
      kcal: (v) => v === '' ? 'カロリーを入力してください' : (!/^[0-9]+$/.test(v) || Number(v) > 10000 ? '0〜10000の整数で入力してください' : ''),
      memo: (v) => v.length > 500 ? '500文字以内で入力してください' : ''
    };
  }
  renderVals() {
    const R = this.rules();
    const S = [["kcal", "memo"]];
    const st = this.state;
    const cur = S[st.step] || [];
    const out = {};
    Object.keys(R).forEach((f) => {
      const e = st.tried && cur.indexOf(f) >= 0 ? R[f](st.values[f]) : '';
      out[f + 'Err'] = e; out[f + 'ErrHas'] = e !== ''; out[f + 'Invalid'] = e !== '' ? 'true' : 'false';
      out['on_' + f] = (ev) => this.setState({ values: Object.assign({}, this.state.values, { [f]: ev.target.value }) });
    });
    for (let i = 0; i <= S.length; i++) out['step' + i] = st.step === i;
    out.submit = () => {
      const ok = cur.every((f) => R[f](this.state.values[f]) === '');
      this.setState(ok ? { step: st.step + 1, tried: false } : { tried: true });
    };
    out.pwType = st.showPw ? 'text' : 'password';
    out.pwShown = st.showPw ? 'true' : 'false';
    out.pwLabel = st.showPw ? '隠す' : '表示';
    out.togglePw = () => this.setState({ showPw: !this.state.showPw });
    const edit = (this.props.mode ?? 'edit') === 'edit';
    out.isEdit = edit;
    out.kcalVal = st.values.kcal;
    out.memoVal = st.values.memo;
    out.formTitle = edit ? 'カロリーを編集' : 'カロリーを記録';
    out.confirming = this.state.confirmDelete;
    out.notConfirming = !this.state.confirmDelete;
    out.askDelete = () => this.setState({ confirmDelete: true });
    out.cancelDelete = () => this.setState({ confirmDelete: false });
    return out;
  }
}
</script>
</body>
</html>
