<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>日タブ(読み込み中)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;background:#F5F5F3;color:#1F1F1D}
a{color:#1F1F1D}a:hover{color:#57574F}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; background: #F5F5F3; display: flex; flex-direction: column; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #1F1F1D">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0 20px; height: 56px; box-sizing: border-box">
    <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 20px">shukanlog</span>
    <a href="Settings.dc.html" aria-label="設定" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </a>
  </header>
  <nav aria-label="表示期間" style="margin: 8px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E9E8E3; border-radius: 14px">
      <a href="Day.dc.html" aria-current="page" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 15px; font-weight: 700; color: #FFFFFF; background: #1F1F1D; text-decoration: none">日</a>
      <a href="Week.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 15px; font-weight: 500; color: #57574F; text-decoration: none">週</a>
      <a href="Month.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 15px; font-weight: 500; color: #57574F; text-decoration: none">月</a>
  </nav>
  <div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 12px 4px">
    <button type="button" aria-label="前の日" onClick="{{ prev }}" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; justify-content: center">
      <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px">{{ dateLabel }}</h1>
      <sc-if value="{{ isToday }}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; color: #57574F">今日</span></sc-if>
      <sc-if value="{{ notToday }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ goToday }}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #1F1F1D; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #1F1F1D; cursor: pointer">今日に戻る</button></sc-if>
    </div>
    <button type="button" aria-label="次の日" aria-disabled="{{ nextDisabled }}" onClick="{{ next }}" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="{{ nextStroke }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
  </div>
  <main aria-busy="true" style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 16px">
        <p role="status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0">記録を読み込んでいます</p>
        <div style="background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
          <div style="height: 18px; width: 30%; border-radius: 10px; background: #ECEBE6"></div>
          <div style="display: flex; gap: 8px"><div style="flex: 1 1 0; height: 52px; border-radius: 12px; background: #ECEBE6"></div><div style="flex: 1 1 0; height: 52px; border-radius: 12px; background: #ECEBE6"></div></div>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
          <div style="height: 18px; width: 30%; border-radius: 10px; background: #ECEBE6"></div>
          <div style="display: flex; gap: 8px"><div style="flex: 1 1 0; height: 52px; border-radius: 12px; background: #ECEBE6"></div><div style="flex: 1 1 0; height: 52px; border-radius: 12px; background: #ECEBE6"></div><div style="flex: 1 1 0; height: 52px; border-radius: 12px; background: #ECEBE6"></div></div>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
          <div style="height: 18px; width: 30%; border-radius: 10px; background: #ECEBE6"></div>
          <div style="height: 28px; width: 45%; border-radius: 10px; background: #ECEBE6"></div>
          <div style="height: 40px; width: 100%; border-radius: 10px; background: #ECEBE6"></div>
        </div>
        <p style="margin: auto 0 0; font-size: 12px; line-height: 1.7; color: #57574F; text-align: center">本サービスは医療機器ではありません。<br>服薬に関する判断は医師・薬剤師にご相談ください。</p>
  </main>
  <div role="status" aria-live="polite" style="position: absolute; left: 0; right: 0; bottom: 84px; display: flex; justify-content: center; pointer-events: none">
    <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}"><span style="background: #1F1F1D; color: #FFFFFF; font-size: 14px; font-weight: 500; padding: 12px 20px; border-radius: 999px">{{ toast }}</span></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      offset: 0,
      records: { '0': { med: 'o', ex: 't' }, '-1': { med: 'o', ex: 't' }, '-2': { med: 'x', ex: 'x' }, '-3': { med: 'o', ex: 'o' }, '-4': { med: 'o', ex: 't' } },
      toast: ''
    };
    this.kcal = { '0': [['朝食', 420], ['昼食', 820]], '-1': [['朝食', 500], ['夕食', 1100]] };
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  showToast(text) {
    clearTimeout(this.timer);
    this.setState({ toast: text });
    this.timer = setTimeout(() => this.setState({ toast: '' }), 2000);
  }
  option(key, kind, label) {
    const rec = this.state.records[String(this.state.offset)] || {};
    const selected = rec[key] === kind;
    const tint = { o: ['#EEF3FE', '#2563EB', '#1D4ED8'], t: ['#FDF3E4', '#D97706', '#B45309'], x: ['#F1F1EF', '#71717A', '#3F3F46'] }[kind];
    const base = 'flex: 1 1 0; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; font-size: 14px; cursor: pointer; ';
    return {
      label: label,
      isO: kind === 'o', isT: kind === 't', isX: kind === 'x',
      pressed: selected ? 'true' : 'false',
      btnStyle: selected
        ? base + 'background: ' + tint[0] + '; border: 2px solid ' + tint[1] + '; color: ' + tint[2] + '; font-weight: 700'
        : base + 'background: #FFFFFF; border: 1px solid #E3E2DC; color: #1F1F1D; font-weight: 500',
      pick: () => {
        const k = String(this.state.offset);
        const next = Object.assign({}, this.state.records[k] || {});
        next[key] = selected ? '' : kind;
        this.setState({ records: Object.assign({}, this.state.records, { [k]: next }) });
        this.showToast(selected ? '記録を取り消しました' : '保存しました');
      }
    };
  }
  renderVals() {
    const off = this.state.offset;
    const d = new Date(2026, 8, 25 + off);
    const w = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    const items = this.kcal[String(off)] || [];
    const total = items.reduce((s, x) => s + x[1], 0);
    return {
      dateLabel: (d.getMonth() + 1) + '月' + d.getDate() + '日(' + w + ')',
      isToday: off === 0,
      notToday: off !== 0,
      nextDisabled: off === 0 ? 'true' : 'false',
      nextStroke: off === 0 ? '#B9B8B1' : '#1F1F1D',
      prev: () => this.setState({ offset: off - 1 }),
      next: () => { if (off < 0) this.setState({ offset: off + 1 }); },
      goToday: () => this.setState({ offset: 0 }),
      habits: [
        { name: '服薬', hint: 'もう一度押すと取り消し', options: [this.option('med', 'o', 'できた'), this.option('med', 'x', 'できなかった')] },
        { name: '運動', hint: 'もう一度押すと取り消し', options: [this.option('ex', 'o', 'できた'), this.option('ex', 't', '少し'), this.option('ex', 'x', 'できなかった')] }
      ],
      hasKcal: items.length > 0,
      noKcal: items.length === 0,
      kcalTotal: total.toLocaleString('ja-JP'),
      kcalItems: items.map((x) => ({ note: x[0], value: x[1].toLocaleString('ja-JP'), aria: x[0] + ' ' + x[1] + 'kcal を編集' })),
      hasToast: this.state.toast !== '',
      toast: this.state.toast
    };
  }
}
</script>
</body>
</html>
