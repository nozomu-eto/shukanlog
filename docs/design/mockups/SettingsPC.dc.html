<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定(PC)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;background:#F5F5F3;color:#1F1F1D}
a{color:#1F1F1D}a:hover{color:#57574F}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 1000px; box-sizing: border-box; background: #F5F5F3; display: flex; flex-direction: column; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #1F1F1D">
  <header style="height: 72px; box-sizing: border-box; padding: 0 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; border-bottom: 1px solid #E3E2DC">
    <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px">shukanlog</span>
    <nav aria-label="表示期間" style="justify-self: center; width: 300px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E9E8E3; border-radius: 14px">
      <a href="DayPC.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 15px; font-weight: 500; color: #57574F; text-decoration: none">日</a>
      <a href="WeekPC.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 15px; font-weight: 500; color: #57574F; text-decoration: none">週</a>
      <a href="MonthPC.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 15px; font-weight: 500; color: #57574F; text-decoration: none">月</a>
    </nav>
    <a href="SettingsPC.dc.html" aria-current="page" style="justify-self: end; min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 12px; font-size: 15px; font-weight: 700; text-decoration: none; color: #1F1F1D; background: #E9E8E3">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>設定
    </a>
  </header>

  <main style="width: 640px; margin: 0 auto; flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 28px 0 40px; box-sizing: border-box">
    <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 26px">設定</h1>

    <div style="display: flex; flex-direction: column; gap: 24px">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #57574F">アカウント</h2>
        <div style="background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; overflow: hidden">
          <a href="EmailChangePC.dc.html" style="min-height: 64px; padding: 8px 16px 8px 18px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1F1F1D">
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">メールアドレス</span><span style="font-size: 13px; color: #57574F">[登録中のメールアドレス]</span></span>
            <span style="font-size: 14px; color: #57574F">変更</span>
          </a>
          <a href="PasswordChangePC.dc.html" style="min-height: 56px; padding: 0 16px 0 18px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1F1F1D; border-top: 1px solid #EEEDE8">
            <span style="font-size: 15px">パスワード</span>
            <span style="font-size: 14px; color: #57574F">変更</span>
          </a>
          <a href="LoginPC.dc.html" style="min-height: 56px; padding: 0 18px; display: flex; align-items: center; border: none; border-top: 1px solid #EEEDE8; background: #FFFFFF; font-size: 15px; color: #1F1F1D; text-decoration: none; box-sizing: border-box">ログアウト</a>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #57574F">記録</h2>
        <div style="background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; padding: 14px 16px 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span id="calorie-label-pc" style="font-size: 15px">カロリーを記録する</span>
            <span style="font-size: 13px; color: #57574F">オフにすると、日・週・月の画面からカロリーの項目が消えます</span>
          </span>
          <button type="button" role="switch" aria-checked="{{ calorieChecked }}" aria-labelledby="calorie-label-pc" onClick="{{ toggleCalorie }}" style="{{ switchStyle }}">
            <span style="{{ trackStyle }}"><span style="{{ knobStyle }}"></span></span>
          </button>
        </div>
      </section>
    </div>

    <div style="display: flex; flex-direction: column; gap: 24px">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #57574F">サポート</h2>
        <div style="background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; overflow: hidden">
          <a href="#terms" style="min-height: 56px; padding: 0 16px 0 18px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1F1F1D">
            <span style="font-size: 15px">利用規約</span>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#57574F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
          </a>
          <a href="#privacy" style="min-height: 56px; padding: 0 16px 0 18px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1F1F1D; border-top: 1px solid #EEEDE8">
            <span style="font-size: 15px">プライバシーポリシー</span>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#57574F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
          </a>
          <a href="mailto:info@shukanlog.com" style="min-height: 64px; padding: 8px 16px 8px 18px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1F1F1D; border-top: 1px solid #EEEDE8">
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">お問い合わせ</span><span style="font-size: 13px; color: #57574F">info@shukanlog.com</span></span>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#57574F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
          </a>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #57574F">退会</h2>
        <div style="background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
          <span style="font-size: 13px; line-height: 1.7; color: #57574F">退会後30日間はデータを保管し、その後完全に削除します。</span>
          <a href="WithdrawPC.dc.html" style="flex-shrink: 0; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #C9C8C1; display: flex; align-items: center; text-decoration: none; font-size: 15px; font-weight: 700; color: #1F1F1D">退会する</a>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { calorie: true };
  }
  renderVals() {
    const on = this.state.calorie;
    return {
      calorieChecked: on ? 'true' : 'false',
      toggleCalorie: () => this.setState({ calorie: !on }),
      switchStyle: 'flex-shrink: 0; width: 60px; height: 44px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center',
      trackStyle: 'width: 52px; height: 32px; border-radius: 999px; padding: 3px; display: flex; align-items: center; box-sizing: border-box; background: ' + (on ? '#1F1F1D' : '#C9C8C1') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start'),
      knobStyle: 'width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; display: block'
    };
  }
}
</script>
</body>
</html>
