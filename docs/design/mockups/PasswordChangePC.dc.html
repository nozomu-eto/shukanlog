<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>パスワードの変更PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;background:#F5F5F3;color:#1F1F1D}
a{color:#1F1F1D}a:hover{color:#57574F}
button,input,textarea{font-family:inherit}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #1F1F1D;outline-offset:2px}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #F5F5F3; display: flex; flex-direction: column; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #1F1F1D">
  <header style="height: 72px; box-sizing: border-box; padding: 0 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; border-bottom: 1px solid #E3E2DC">
    <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px">shukanlog</span>
    <nav aria-label="表示期間" style="justify-self: center; width: 300px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E9E8E3; border-radius: 14px">
      <a href="DayPC.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 15px; font-weight: 500; color: #57574F; text-decoration: none">日</a>
      <a href="WeekPC.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 15px; font-weight: 500; color: #57574F; text-decoration: none">週</a>
      <a href="MonthPC.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 15px; font-weight: 500; color: #57574F; text-decoration: none">月</a>
    </nav>
    <a href="SettingsPC.dc.html" aria-current="page" style="justify-self: end; min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 12px; font-size: 15px; font-weight: 700; text-decoration: none; color: #1F1F1D; background: #E9E8E3">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>設定
    </a>
  </header>
  <main style="width: 640px; margin: 0 auto; flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px 0 40px; box-sizing: border-box">
    <a href="SettingsPC.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 4px; font-size: 14px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F1F1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>設定に戻る</a>
    <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 26px">パスワードの変更</h1>
    <div style="background: #FFFFFF; border: 1px solid #E3E2DC; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <sc-if value="{{ step0 }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="curPw" style="font-size: 14px; font-weight: 700">現在のパスワード</label>
        <div style="display: flex; gap: 8px">
          <input id="curPw" type="{{ pwType }}" autocomplete="current-password" aria-describedby="curPw-error" aria-invalid="{{ curPwInvalid }}" onInput="{{ on_curPw }}" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #1F1F1D; flex: 1 1 auto; min-width: 0">
          <button type="button" aria-pressed="{{ pwShown }}" onClick="{{ togglePw }}" style="flex-shrink: 0; min-width: 64px; height: 48px; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; font-size: 14px; color: #1F1F1D; cursor: pointer">{{ pwLabel }}</button>
        </div>
        <sc-if value="{{ curPwErrHas }}" hint-placeholder-val="{{ false }}"><p id="curPw-error" style="margin: 0; font-size: 13px; color: #B42318">{{ curPwErr }}</p></sc-if>
      </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="newPw" style="font-size: 14px; font-weight: 700">新しいパスワード</label>
        <span id="newPw-help" style="font-size: 13px; line-height: 1.6; color: #57574F">8文字以上</span>
        <div style="display: flex; gap: 8px">
          <input id="newPw" type="{{ pwType }}" autocomplete="new-password" aria-describedby="newPw-help newPw-error" aria-invalid="{{ newPwInvalid }}" onInput="{{ on_newPw }}" style="width: 100%; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #1F1F1D; flex: 1 1 auto; min-width: 0">
          <button type="button" aria-pressed="{{ pwShown }}" onClick="{{ togglePw }}" style="flex-shrink: 0; min-width: 64px; height: 48px; border-radius: 12px; border: 1px solid #8A8983; background: #FFFFFF; font-size: 14px; color: #1F1F1D; cursor: pointer">{{ pwLabel }}</button>
        </div>
        <sc-if value="{{ newPwErrHas }}" hint-placeholder-val="{{ false }}"><p id="newPw-error" style="margin: 0; font-size: 13px; color: #B42318">{{ newPwErr }}</p></sc-if>
      </div>
        <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #57574F">変更すると、ほかの端末ではログアウトされます。</p>
        <button type="button" onClick="{{ submit }}" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%">パスワードを変更する</button>
      </div>
      </sc-if>
      <sc-if value="{{ step1 }}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; flex-direction: column; gap: 12px">
        <p style="margin: 0; font-size: 15px; line-height: 1.7">パスワードを変更しました。</p>
        <a href="SettingsPC.dc.html" style="min-height: 52px; border-radius: 14px; border: none; background: #1F1F1D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%">設定に戻る</a>
      </div></sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { values: { curPw: "", newPw: "" }, step: 0, tried: false, showPw: false };
  }
  rules() {
    return {
      curPw: (v) => !v ? 'パスワードを入力してください' : '',
      newPw: (v) => !v ? 'パスワードを入力してください' : (v.length < 8 ? '8文字以上で入力してください' : '')
    };
  }
  renderVals() {
    const R = this.rules();
    const S = [["curPw", "newPw"]];
    const st = this.state;
    const cur = S[st.step] || [];
    const out = {};
    Object.keys(R).forEach((f) => {
      const e = st.tried && cur.indexOf(f) >= 0 ? R[f](st.values[f]) : '';
      out[f + 'Err'] = e; out[f + 'ErrHas'] = e !== ''; out[f + 'Invalid'] = e !== '' ? 'true' : 'false';
      out['on_' + f] = (ev) => this.setState({ values: Object.assign({}, this.state.values, { [f]: ev.target.value }) });
    });
    for (let i = 0; i <= S.length; i++) out['step' + i] = st.step === i;
    out.submit = () => {
      const ok = cur.every((f) => R[f](this.state.values[f]) === '');
      this.setState(ok ? { step: st.step + 1, tried: false } : { tried: true });
    };
    out.pwType = st.showPw ? 'text' : 'password';
    out.pwShown = st.showPw ? 'true' : 'false';
    out.pwLabel = st.showPw ? '隠す' : '表示';
    out.togglePw = () => this.setState({ showPw: !this.state.showPw });

    return out;
  }
}
</script>
</body>
</html>
